app = "rps-politika"
primary_region = "fra"

[build]
  [build.args]
    # The Clarity project id. Public by design: the browser fetches clarity.ms/tag/<id>, so this is
    # readable by anyone with devtools. It lives here rather than in a Fly secret because Vite
    # inlines VITE_* at build time, and a secret only exists at runtime.
    VITE_CLARITY_ID = "ye8yai5w8h"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
