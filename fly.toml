app = "rps-politika"
primary_region = "fra"

[build]
  [build.args]
    # Paste the Clarity project id here to switch analytics on, then deploy. Public by design.
    VITE_CLARITY_ID = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
